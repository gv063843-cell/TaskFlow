<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow AI Dashboard</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

<!-- =========================
     TOP BAR
========================== -->

<div class="top-bar">

    <h1>🚀 TaskFlow AI Dashboard</h1>

    <button
        id="logoutBtn"
        class="logout-btn"
    >
        🚪 Logout
    </button>

</div>


<!-- =========================
     PROJECT MANAGEMENT
========================== -->

<div class="card">

    <h2>📁 My Project</h2>

    <label for="projectSelect">
        Select Project
    </label>

    <select id="projectSelect">

        <option value="">
            Loading Projects...
        </option>

    </select>


    <input
        type="text"
        id="projectName"
        placeholder="Enter project name"
    >


    <input
        type="text"
        id="projectDescription"
        placeholder="Project description"
    >


    <button id="createProjectBtn">
        ➕ Create Project
    </button>


    <p id="projectInfo"></p>

</div>


<!-- =========================
     ADD TASK
========================== -->

<div class="card">

    <h2>➕ Add New Task</h2>

    <!-- Task Title -->

    <label for="taskTitle">
        Task Title
    </label>

    <input
        type="text"
        id="taskTitle"
        placeholder="Enter Task Title"
    >


    <!-- Priority -->

    <label for="taskPriority">
        Priority
    </label>

    <select id="taskPriority">

        <option value="low">
            Low Priority
        </option>

        <option
            value="medium"
            selected
        >
            Medium Priority
        </option>

        <option value="high">
            High Priority
        </option>

    </select>


    <!-- Complete By / Due Date -->

    <label for="taskDueDate">
        Complete By
    </label>

    <input
        type="date"
        id="taskDueDate"
        title="Select the date by which this task should be completed"
    >


    <!-- Add Task Button -->

    <button id="addTaskBtn">
        ➕ Add Task
    </button>

</div>


<!-- =========================
     AI QUICK ADD
========================== -->

<div class="card">

    <h2>🤖 AI Quick Add</h2>

    <input
        type="text"
        id="aiText"
        placeholder="e.g. Finish report next Friday, urgent"
    >

    <button id="aiBtn">
        Generate Task
    </button>

</div>


<!-- =========================
     SEARCH
========================== -->

<div class="card">

    <h2>🔍 Search Task</h2>

    <input
        type="text"
        id="searchText"
        placeholder="Search task..."
    >

    <button id="searchBtn">
        Search
    </button>

    <button id="showAllBtn">
        Show All
    </button>

</div>


<!-- =========================
     STATISTICS
========================== -->

<div class="card">

    <h2>📊 Statistics</h2>

    <button id="statsBtn">
        Load Statistics
    </button>

    <div id="stats"></div>

</div>


<!-- =========================
     TASK LIST
========================== -->

<div class="card">

    <h2>📋 Task List</h2>

    <ul id="taskList"></ul>

</div>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="./script.js"></script>

</body>

</html>
