<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow AI Dashboard</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="container">

        <!-- TOP BAR -->

        <div class="top-bar">

            <h1>🚀 TaskFlow AI Dashboard</h1>

            <button
                id="logoutBtn"
                class="logout-btn"
            >
                🚪 Logout
            </button>

        </div>


        <!-- ADD TASK -->

        <div class="card">

            <h2>➕ Add New Task</h2>

            <input
                type="text"
                id="taskTitle"
                placeholder="Enter Task Title"
            >

            <select id="taskPriority">

                <option value="low">
                    Low Priority
                </option>

                <option value="medium" selected>
                    Medium Priority
                </option>

                <option value="high">
                    High Priority
                </option>

            </select>

            <button id="addTaskBtn">
                Add Task
            </button>

        </div>


        <!-- AI QUICK ADD -->

        <div class="card">

            <h2>🤖 AI Quick Add</h2>

            <input
                type="text"
                id="aiText"
                placeholder="e.g. Finish report next Friday, urgent"
            >

            <button id="aiBtn">
                Generate Task
            </button>

        </div>


        <!-- SEARCH -->

        <div class="card">

            <h2>🔍 Search Task</h2>

            <input
                type="text"
                id="searchText"
                placeholder="Search task..."
            >

            <button id="searchBtn">
                Search
            </button>

            <button id="showAllBtn">
                Show All
            </button>

        </div>


        <!-- STATISTICS -->

        <div class="card">

            <h2>📊 Statistics</h2>

            <button id="statsBtn">
                Load Statistics
            </button>

            <div id="stats"></div>

        </div>


        <!-- TASK LIST -->

        <div class="card">

            <h2>📋 Task List</h2>

            <ul id="taskList"></ul>

        </div>

    </div>


    <script src="./script.js"></script>

</body>

</html>
