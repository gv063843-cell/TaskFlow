<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow AI Dashboard</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

<div class="container">

    <!-- TOP BAR -->

    <div class="top-bar">

        <h1>🚀 TaskFlow AI Dashboard</h1>

        <button
            id="logoutBtn"
            class="logout-btn"
        >
            🚪 Logout
        </button>

    </div>


    <!-- PROJECT MANAGEMENT -->

    <div class="card">

        <h2>📁 Projects</h2>

        <select id="projectSelect">

            <option value="">
                Select Project
            </option>

        </select>

        <input
            type="text"
            id="projectName"
            placeholder="Enter project name"
        >

        <input
            type="text"
            id="projectDescription"
            placeholder="Project description"
        >

        <button id="createProjectBtn">
            ➕ Create Project
        </button>

    </div>


    <!-- ADD TASK -->

    <div class="card">

        <h2>➕ Add New Task</h2>

        <select id="projectSelectTask">

            <option value="">
                Select Project First
            </option>

        </select>

        <input
            type="text"
            id="taskTitle"
            placeholder="Enter Task Title"
        >

        <select id="taskPriority">

            <option value="low">
                Low Priority
            </option>

            <option
                value="medium"
                selected
            >
                Medium Priority
            </option>

            <option value="high">
                High Priority
            </option>

        </select>

        <button id="addTaskBtn">
            Add Task
        </button>

    </div>


    <!-- AI QUICK ADD -->

    <div class="card">

        <h2>🤖 AI Quick Add</h2>

        <select id="projectSelectAI">

            <option value="">
                Select Project First
            </option>

        </select>

        <input
            type="text"
            id="aiText"
            placeholder="e.g. Finish report next Friday, urgent"
        >

        <button id="aiBtn">
            Generate Task
        </button>

    </div>


    <!-- SEARCH -->

    <div class="card">

        <h2>🔍 Search Task</h2>

        <input
            type="text"
            id="searchText"
            placeholder="Search task..."
        >

        <button id="searchBtn">
            Search
        </button>

        <button id="showAllBtn">
            Show All
        </button>

    </div>


    <!-- STATISTICS -->

    <div class="card">

        <h2>📊 Statistics</h2>

        <button id="statsBtn">
            Load Statistics
        </button>

        <div id="stats"></div>

    </div>


    <!-- TASK LIST -->

    <div class="card">

        <h2>📋 Task List</h2>

        <ul id="taskList"></ul>

    </div>

</div>


<!-- =========================
     EDIT TASK MODAL
========================= -->

<div
    id="editModal"
    class="edit-modal"
    style="display: none;"
>

    <div class="edit-modal-content">

        <h2>✏️ Edit Task</h2>

        <input
            type="hidden"
            id="editTaskId"
        >

        <label>
            Task Title
        </label>

        <input
            type="text"
            id="editTaskTitle"
            placeholder="Task title"
        >


        <label>
            Description
        </label>

        <textarea
            id="editTaskDescription"
            placeholder="Task description"
        ></textarea>


        <label>
            Priority
        </label>

        <select id="editTaskPriority">

            <option value="low">
                Low
            </option>

            <option value="medium">
                Medium
            </option>

            <option value="high">
                High
            </option>

        </select>


        <label>
            Status
        </label>

        <select id="editTaskStatus">

            <option value="Pending">
                Pending
            </option>

            <option value="Completed">
                Completed
            </option>

        </select>


        <label>
            Due Date
        </label>

        <input
            type="date"
            id="editTaskDueDate"
        >


        <div class="edit-buttons">

            <button id="saveEditBtn">
                💾 Save Changes
            </button>

            <button id="cancelEditBtn">
                ❌ Cancel
            </button>

        </div>

    </div>

</div>


<script src="./script.js"></script>

</body>

</html>
