<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskFlow - Login</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>🚀 TaskFlow</h1>

            <p class="login-subtitle">
                AI Powered Task Management System
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </div>

    <script src="./login.js"></script>

</body>

</html>
